<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>后台直出进度 · 闪耀色彩剧情工坊</title>
  <style>
    @font-face {
      font-family: "AlimamaShuHeiTi";
      src: url("./fonts/AlimamaShuHeiTi.ttf") format("truetype");
    }
    :root { color-scheme: dark; font-family: "AlimamaShuHeiTi", "Microsoft YaHei UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 300px; background: #17151c; color: #f8f4fa; }
    main { width: min(100%, 660px); margin: auto; padding: 22px 20px 26px; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    h1 { margin: 0; font-size: 21px; line-height: 1.35; }
    .muted { color: #b8adbd; }
    .summary { margin: 8px 0 19px; font-size: 13px; }
    button { font: inherit; font-size: 14px; color: #fff; background: #38313e; border: 1px solid #625364; border-radius: 10px; padding: 8px 12px; cursor: pointer; }
    button:hover:not(:disabled) { background: #57435b; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    .header-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .header-actions button { white-space: nowrap; }
    #message { min-height: 20px; font-size: 13px; }
    #message[data-tone="error"] { color: #ffabab; }
    #message[data-tone="good"] { color: #a5e9c1; }
    .jobs { display: grid; gap: 10px; margin-top: 10px; }
    .job { background: #25212b; border: 1px solid #453a48; border-radius: 12px; padding: 13px; }
    .job[data-state="failed"], .job[data-state="interrupted"] { border-color: #a35b66; }
    .job[data-state="complete"] { border-color: #4a8065; }
    .job[data-state="paused"] { border-color: #d39a54; background: #302925; }
    .job-head { display: flex; justify-content: space-between; gap: 14px; align-items: baseline; }
    .job-title { font-size: 15px; overflow-wrap: anywhere; }
    .job-stage { color: #e5acd0; font-size: 13px; flex-shrink: 0; }
    .job-meta, .job-detail { font-size: 12px; color: #b8adbd; margin: 5px 0 0; overflow-wrap: anywhere; }
    .job-error { color: #ffabab; }
    .job-pause { color: #f3c68c; }
    .job-actions { margin-top: 11px; }
    progress { display: block; width: 100%; height: 8px; margin-top: 11px; accent-color: #e078b7; }
    .settings { margin-top: 19px; border: 1px solid #453a48; border-radius: 12px; padding: 13px; }
    .settings h2 { margin: 0 0 4px; font-size: 15px; }
    .settings p { margin: 0 0 12px; font-size: 12px; line-height: 1.5; }
    .settings-fields { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
    label { color: #cfc2d2; font-size: 12px; display: grid; gap: 4px; }
    input { width: 126px; padding: 7px 9px; background: #18151d; color: #fff; border: 1px solid #66566c; border-radius: 8px; font: inherit; }
    #memory-status { margin: 10px 0 0; min-height: 18px; }
    #memory-status[data-tone="error"] { color: #ffabab; }
    #memory-status[data-tone="good"] { color: #a5e9c1; }
    #parked-view[hidden], #monitor-view[hidden] { display: none; }
    @media (max-width: 450px) { main { padding: 17px 14px; } header { align-items: center; } h1 { font-size: 18px; } .job-head { display: block; } }
  </style>
  <script src="./scripts/OfflineProgress.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>后台直出进度</h1>
      <div class="header-actions">
        <button id="open-output" type="button">打开保存目录</button>
        <button id="return-workshop" type="button">返回工坊</button>
      </div>
    </header>
    <section id="parked-view" hidden>
      <p class="muted">后台任务仍在继续，进度显示在独立窗口。此页不加载播放器，也不轮询任务。</p>
    </section>
    <section id="monitor-view" hidden>
      <p id="summary" class="summary muted">正在读取任务状态…</p>
      <p id="message" role="status" aria-live="polite"></p>
      <div id="jobs" class="jobs" aria-live="polite"></div>
      <section class="settings" aria-labelledby="settings-title">
        <h2 id="settings-title">本批任务的内存设置</h2>
        <p class="muted">运行中的任务会在下一次安全采样时采用新设置，排队任务在启动前采用。调低限额可能使任务暂停或失败；调高限额不保证提速，请给系统留足余量。</p>
        <div class="settings-fields">
          <label>进程上限（MiB）<input id="memory-limit" type="number" inputmode="numeric" step="1"></label>
          <label>系统保留（MiB）<input id="memory-reserve" type="number" inputmode="numeric" step="1"></label>
          <button id="memory-save" type="button" disabled>应用到本批任务</button>
        </div>
        <p id="memory-status" role="status" aria-live="polite"></p>
      </section>
    </section>
  </main>
</body>
</html>
